server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html references the current hashed JS/CSS bundle filenames, so it
    # must always be revalidated - otherwise a browser tab left open across a
    # rebuild keeps running old JS indefinitely, silently breaking against a
    # newer backend response shape instead of visibly erroring.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The hashed bundle filenames themselves are safe to cache aggressively -
    # a rebuild always produces a new filename, so there's no staleness risk.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}